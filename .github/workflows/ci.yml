name: CI — types + invariant tests

# Runs on EVERY pull request, with no path filter. That is the point: before this
# workflow the only PR gate was rh-rwa-semantic-smoke.yml, which fires solely on
# `rh-*` paths, so a change anywhere else merged with nothing run against it.
#
# `next build` is deliberately NOT run here — the Vercel preview already builds
# every PR, and duplicating it would add ~4min for a second copy of the same answer.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace deps
        run: npm ci

      # dead-tool-check's F2 compares packages/skill/dist against its src, because
      # dist/ is what npm actually runs for @blueagent/skill. dist/ is gitignored,
      # so it has to be built here. This is an EXPLICIT step on purpose — see the
      # 🔴 block above `skillEntries` in apps/web/scripts/dead-tool-check.ts before
      # moving it into any `prepare` script. Both shapes of that idea were tried on
      # 2026-09-26; one broke CI, the other broke six production deploys.
      - name: Build packages the invariant tests read
        run: npm run build:skill

      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Invariant tests
        working-directory: apps/web
        run: npm test
